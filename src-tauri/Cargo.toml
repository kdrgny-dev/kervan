[package]
name = "kervan"
version = "0.3.0"
description = "Kervan — snake + otomatik savaş roguelite"
authors = ["Kadir Günay"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "kervan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
