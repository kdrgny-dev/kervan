name: Release

# v ile başlayan bir etiket atılınca 3 işletim sistemi için masaüstü derler ve taslak GitHub Release oluşturur.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Taslak tek yerde açılır; matris işleri aynı anda açmaya çalışınca iki taslak oluşuyordu
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Kervan $TAG" -F draft=true \
              -f body="Kurulum dosyaları aşağıda. macOS ve Windows sürümleri henüz imzasız; ilk açılışta güvenlik uyarısını onaylaman gerekir." \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

  web-zip:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: itch.io için web paketi
        run: cd dist && zip -r ../kervan-web-${{ github.ref_name }}.zip .
      - name: Taslak sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} kervan-web-${{ github.ref_name }}.zip --clobber
